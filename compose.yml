services:
  db:
    container_name: edusync_cat_db
    image: docker.io/library/postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-edusync_db}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "5432:5432"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - edusync-net

networks:
  edusync-net: